<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Acceder a OMUSIC para Android</title><link rel="icon" href="favicon.svg">
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101713;color:#f2f6f3}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:26px}main{width:min(100%,420px);background:#1b241e;border:1px solid #ffffff14;border-radius:28px;padding:34px 28px;box-shadow:0 28px 80px #0005}.brand{color:#61dc8c;letter-spacing:2px;font-size:13px;font-weight:800}h1{font-size:30px;letter-spacing:-1px;line-height:1.15;margin:20px 0 14px}p{color:#b7c7bd;line-height:1.7;font-size:14px}button,a{display:block;width:100%;border:0;border-radius:24px;padding:16px;background:#83e3a4;color:#112719;font:700 15px system-ui;text-decoration:none;text-align:center;cursor:pointer;margin-top:26px}button:disabled{opacity:.6;cursor:wait}a[hidden],button[hidden]{display:none}.note{font-size:12px;margin-top:24px;color:#93a99b}#status{min-height:26px;overflow-wrap:anywhere}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}
</style>
<script src="firebase-config.js"></script><script type="module" src="omusic-android-auth.js"></script>
</head>
<body><main><span class="brand">OMUSIC · ANDROID</span><h1>Tu música te espera.</h1><p>Inicia sesión en este navegador para continuar en la app de OMUSIC.</p><button id="signin" disabled>Preparando acceso…</button><a id="return" hidden>Volver a OMUSIC</a><p id="status" role="status" aria-live="polite">Conectando con el servicio de acceso.</p><p class="note">El acceso vuelve cifrado a la app que inició esta solicitud. Tu contraseña se introduce únicamente en Google o GitHub.</p></main></body>
</html>
